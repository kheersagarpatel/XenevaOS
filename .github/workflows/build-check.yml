name: XenevaOS Build Check (MSVC & GCC)

on:
  push:
    branches: [ master, khrsgr ]
  pull_request:
    branches: [ master, khrsgr ]
  workflow_dispatch:

jobs:
  build-linux-gcc:
    name: GCC (Linux / ARM64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Toolchains (GCC & LLVM AArch64)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu clang lld make mtools dosfstools

      - name: Build GNU-EFI (AArch64)
        run: |
          git clone https://github.com/vathpela/gnu-efi gnu-efi
          cd gnu-efi
          make ARCH=aarch64 CROSS_COMPILE=aarch64-linux-gnu-

      - name: Build Bootloader (BootAA64 - GCC)
        run: |
          cd BootAA64
          make clean
          make

      - name: Build Kernel (KernelAA64 - GCC)
        run: |
          cd KernelAA64
          make clean
          make

  build-linux-llvm:
    name: LLVM (Linux / ARM64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Toolchains (LLVM AArch64)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu clang lld make mtools dosfstools

      - name: Build GNU-EFI (AArch64)
        run: |
          git clone https://github.com/vathpela/gnu-efi gnu-efi
          cd gnu-efi
          make ARCH=aarch64 CROSS_COMPILE=aarch64-linux-gnu-

      - name: Build Bootloader (BootAA64 - LLVM)
        run: |
          cd BootAA64
          make clean
          make llvm

      - name: Build Kernel (KernelAA64 - LLVM)
        run: |
          cd KernelAA64
          make clean
          make llvm

  build-windows-msvc:
    name: MSVC (Windows / ARM64)
    runs-on: windows-2022
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.1

      - name: Install NASM
        uses: ilammy/setup-nasm@v1

      - name: Setup NASM Customizations for MSBuild
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          
          # Copy nasm.exe to VC directory for nasm.targets
          $vcPath = Join-Path $vsPath "VC"
          $nasmExePath = Get-Command nasm.exe | Select-Object -ExpandProperty Source
          Copy-Item $nasmExePath -Destination $vcPath -Force

          Expand-Archive -Path Resources/nasmprops.zip -DestinationPath nasmprops -Force
          $msbuildVcPath = Join-Path $vsPath "MSBuild\Microsoft\VC"
          $customizationsPaths = Get-ChildItem -Path $msbuildVcPath -Filter "BuildCustomizations" -Directory -Recurse | Select-Object -ExpandProperty FullName
          foreach ($path in $customizationsPaths) {
              Copy-Item nasmprops\* -Destination $path -Force -Recurse
          }

      - name: Build Solution (Aurora.sln)
        run: |
          msbuild Aurora.sln /p:Configuration=Debug /p:Platform=ARM64 /p:PlatformToolset=v143
